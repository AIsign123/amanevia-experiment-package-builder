<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amanevia 実験パッケージ・ビルダー(試作)</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./src/ui/styles.css">
</head>
<body>
  <header class="top">
    <h1>実験パッケージ・ビルダー</h1>
    <p class="note">試作版です。物質データと規則は説明用の仮データで、安全性の認証を受けたものではありません。実機の運用前に、必ず専門家が規則を確認してください。</p>
  </header>

  <main class="layout">
    <section class="col" aria-labelledby="h-exp">
      <h2 id="h-exp">1. 実験を選ぶ</h2>
      <div id="templates" class="cards" role="radiogroup" aria-label="実験テンプレート"></div>

      <h2 id="h-params">2. 条件を入れる</h2>
      <form id="params" class="form" onsubmit="return false"></form>

      <h2 id="h-mods">3. 装置モジュールを選ぶ</h2>
      <div class="row">
        <button type="button" id="btn-recommend">推奨を自動選択</button>
        <button type="button" id="btn-clear" class="ghost">すべて外す</button>
      </div>
      <div id="modules" class="modules"></div>
    </section>

    <section class="col" aria-labelledby="h-prev">
      <h2 id="h-prev">4. 手順の確認</h2>
      <ol id="steps" class="steps"></ol>

      <h2 id="h-guard">5. ガードレールの判定</h2>
      <div id="verdict" class="verdict" role="status" aria-live="polite"></div>
      <ul id="findings" class="findings"></ul>

      <h2 id="h-out">6. 承認と出力</h2>
      <div id="approval" class="approval"></div>
      <div class="row">
        <button type="button" id="btn-json">JSONを保存</button>
        <button type="button" id="btn-md" class="ghost">Markdownをコピー</button>
      </div>
      <p id="out-msg" class="msg" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script type="module" src="./src/ui/app.js"></script>
</body>
</html>
